title: Claude Code Backdoor - SysMon Scheduled Task or OpenSSH Server Install
id: 3dcf4b28-6ac8-4799-b10b-719ba481777e
status: experimental
description: |
    Windows persistence and SSH enablement of the trojanized anthropic.claude-code 2.1.313
    extension: a scheduled task named "SysMon" running smt.cmd, and installation of the OpenSSH
    server capability from the editor's process tree.
references:
    - https://cursor.com/blog/claude-code-extension-security-notice
    - https://opensourcemalware.com/blog/trojanized-claude-code-extension-plants-persistent-ssh-backdoor
    - https://github.com/happyhackingspace/claude-code-backdoor-check
author: HappyHackingSpace
date: 2026-10-30
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.t1021.004
logsource:
    product: windows
    category: process_creation
detection:
    selection_task:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - 'SysMon'
    selection_task_payload:
        CommandLine|contains: 'smt.cmd'
    selection_ssh:
        CommandLine|contains|all:
            - 'Add-WindowsCapability'
            - 'OpenSSH.Server'
    selection_ssh_parent:
        ParentImage|contains:
            - '\Cursor\'
            - '\Microsoft VS Code\'
            - '\Windsurf\'
    condition: (selection_task and selection_task_payload) or (selection_ssh and selection_ssh_parent)
falsepositives:
    - Administrators installing OpenSSH Server from an editor's integrated terminal
level: high
